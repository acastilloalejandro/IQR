name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path(".").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("JSON validation passed")
          PY
